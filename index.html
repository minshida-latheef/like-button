<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Like Button</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container -->
    <div class="container">

        <h1>Simple Like Button</h1>

        <!-- Like button -->
        <button id="likeButton" class="like-button">
            <span id="heart" class="heart">♡</span>
            <span id="likeText">Like</span>
        </button>

        <!-- Like count -->
        <p>Likes: <span id="likeCount">0</span></p>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
